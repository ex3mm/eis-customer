services:
  eis-customer:
    image: ${DOCKERHUB_REPOSITORY:-username/eis-customer}:${IMAGE_TAG:-latest}
    build:
      context: .
    env_file:
      - path: .env
        required: false
    ports:
      - "${EIS_PORT:-8080}:${EIS_SERVER_PORT:-8080}"
    volumes:
      - ./cert:/app/cert:ro
      - ./fixtures:/app/fixtures
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${EIS_SERVER_PORT:-8080}/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
